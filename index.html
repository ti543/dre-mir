<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DRE - MIR</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{--page:#3d4476;--surface:#fcfcfb;--surface2:#f5f4f1;--blue:#293082;--txt:#0b0b0b;--muted:#6b6a66;--muted2:#52514e;
 --border:rgba(11,11,11,.10);--grid:rgba(11,11,11,.08);
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
 --pos:#2a78d6;--neg:#e34948;--ok:#14845d;--warn:#b57900}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--txt)}
.wrap{max-width:1320px;margin:0 auto;padding:22px 16px 50px}
.brand-header{background:#fff;border-radius:12px;padding:14px 26px;margin-bottom:16px;display:flex;
 align-items:center;justify-content:center;gap:32px;flex-wrap:wrap;box-shadow:0 3px 14px rgba(0,0,0,.20);}
.brand-logo{height:54px;} .brand-iso{height:52px;} .brand-tagline{height:46px;}
.title{color:#fff;text-align:center;margin:4px 0 2px;font-size:26px;font-weight:800}
.sub{color:#cfd3ee;text-align:center;margin:0 0 16px;font-size:13px} .sub b{color:#fff}
/* senha */
#lock{max-width:380px;margin:40px auto;background:var(--surface);border-radius:14px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.25);text-align:center}
#lock h2{margin:0 0 6px;color:var(--blue);font-size:20px} #lock p{margin:0 0 14px;color:var(--muted);font-size:13px}
#lock input[type=password]{width:100%;padding:10px 12px;border:1px solid #c9c8c3;border-radius:8px;font-size:15px}
#lock button{margin-top:12px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
#lock label{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:10px;font-size:12.5px;color:var(--muted2)}
#lockErr{color:#b8434a;font-size:13px;margin-top:8px;min-height:16px}
/* barra de filtros */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.bar .lbl{color:#cfd3ee;font-size:12.5px;font-weight:700;margin-right:2px}
.chip{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:#fff;color:var(--blue);font-weight:800;border-color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:9px 15px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.on{background:#fff;color:var(--blue)}
.tab .n{background:#d84b52;color:#fff;border-radius:99px;padding:1px 7px;font-size:11px;margin-left:6px}
.sec{display:none} .sec.on{display:block}
.card{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.16);margin-bottom:14px;min-width:0}
.card h3{margin:0 0 2px;font-size:15.5px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .hint{margin:0 0 10px;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px} .grid2>.card{margin-bottom:0}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}} @media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.16);min-width:0}
.kpi .k{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:22px;font-weight:800;color:var(--txt);margin:3px 0 2px;white-space:nowrap}
.kpi .d{font-size:12px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--ok);font-weight:700} .down{color:#b8434a;font-weight:700}
.neg{color:#b8434a}
/* tabela DRE */
.tw{overflow:auto;max-height:72vh;border:1px solid var(--border);border-radius:10px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:6px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
th{position:sticky;top:0;background:#eceaf6;color:var(--blue);font-weight:800;z-index:2}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;max-width:330px;overflow:hidden;text-overflow:ellipsis}
th:first-child{z-index:3;background:#eceaf6}
td.sel,th.sel{background:#fff6d6} th.sel{background:#f5e7a8}
tr.tot td{font-weight:800;background:#f1f0fa} tr.tot td:first-child{background:#f1f0fa}
tr.g1 td{font-weight:700} tr.g2 td:first-child{padding-left:24px} tr.g3 td:first-child{padding-left:40px;color:var(--muted2)} tr.g4 td:first-child{padding-left:56px;color:var(--muted)}
tr.g2 td.sel,tr.g3 td.sel,tr.g4 td.sel{background:#fff9e6}
.tg{cursor:pointer;user-select:none} .tg:before{content:"▸ ";color:var(--blue)} .tg.open:before{content:"▾ "}
tr.fora td{color:#999;font-style:italic}
.opts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:12.5px;color:var(--muted2)}
.btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--blue);font-weight:700}
/* gráficos */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-size:11px;fill:var(--muted2)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted2);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;background:#16173a;color:#fff;font-size:12px;padding:7px 9px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.3);display:none;z-index:50;max-width:320px;line-height:1.45}
#tip b{color:#fff} #tip .m{color:#c7cbef}
.hb{display:grid;grid-template-columns:minmax(120px,240px) 1fr 150px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0;cursor:default}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .hb .vl{text-align:right;white-space:nowrap;color:var(--muted2)}
.hb .tr{background:var(--surface2);border-radius:4px;height:14px;position:relative}
.hb .fl{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1)}
.hb.click{cursor:pointer} .hb.click:hover .nm{color:var(--blue);text-decoration:underline}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1050px){.mini{grid-template-columns:repeat(2,1fr)}} @media(max-width:560px){.mini{grid-template-columns:1fr}}
.mini .card{margin:0}
.mini .big{font-size:20px;font-weight:800;margin:2px 0} .mini .cmp{font-size:11.5px;color:var(--muted)}
.alerta{border-left:4px solid var(--warn);background:#fff8e5;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:13px;line-height:1.4}
.ok{border-left-color:var(--ok);background:#e9f6f0}
td.ed{cursor:pointer} td.ed:hover{outline:2px solid #2a78d6;outline-offset:-2px}
td.aj,.aj{background:#ffe2c6 !important;color:#7a3a00;font-weight:700}
.ajbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fff3cd;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.segs{display:inline-flex;background:#eceaf6;border-radius:10px;padding:3px;margin:0 0 10px} .seg{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:700;color:var(--muted2);cursor:pointer;font-size:13px} .seg.on{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.15)}
table.xl td.pc,table.xl th.pc{font-size:11px;color:var(--muted);padding-left:3px;padding-right:8px;border-right:1px solid var(--grid)} table.xl th.pc{color:#6b6fa8}
td.temdet{text-decoration:underline dotted rgba(41,48,130,.45);text-underline-offset:3px;cursor:help}
td.trace{cursor:pointer} td.trace:hover{background:#e8f0ff !important}
.chipf{background:#eef1ff;border-radius:99px;padding:4px 10px;font-size:12.5px} .chipf a{color:#b8434a;font-weight:800;text-decoration:none;margin-left:4px}
.edsw{background:#eef1ff;border-radius:8px;padding:4px 8px}
.unsel{background:#fff;color:var(--blue);font-weight:800;border:0;padding:6px 10px;border-radius:99px}
.unhead{background:var(--surface);border-radius:14px;padding:12px 16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.16);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-left:8px solid var(--s1)}
.unhead .k{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em} .unhead .t{font-size:24px;font-weight:800;color:var(--blue);white-space:nowrap}
.hint2{font-size:12.5px;color:var(--muted2)} .hint2 a{color:var(--blue);font-weight:700}
.g0{gap:18px} .minitit{font-weight:800;font-size:13px;color:var(--blue);margin:2px 0 6px}
table.tvar td:first-child{max-width:240px} table.tvar th,table.tvar td{font-size:12px;padding:5px 7px}
table.tvar th:first-child,table.tvar td:first-child{position:static}
.hmt th{text-align:center;line-height:1.2} .hmt td.hm{text-align:center;font-weight:600;border-left:2px solid #fcfcfb} .hmt th{white-space:nowrap}
.ulink{color:var(--txt);text-decoration:none;font-weight:700} .ulink:hover{color:var(--blue);text-decoration:underline}
i.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mc h3{font-size:14px} .ulink2:hover{box-shadow:0 0 0 2px var(--s1),0 2px 10px rgba(0,0,0,.16)}
.foot{color:#cfd3ee;text-align:center;font-size:12px;margin-top:22px;line-height:1.5}
select{padding:6px 8px;border-radius:8px;border:1px solid #c9c8c3;font-size:13px}
</style></head><body>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(v<0?'-':'')+'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl0=v=>(v<0?'-':'')+'R$ '+Math.abs(v).toLocaleString('pt-BR',{maximumFractionDigits:0});
function curto(v){const a=Math.abs(v),s=v<0?'-':'';
 if(a>=1e6)return s+'R$ '+(a/1e6).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' mi';
 if(a>=1e3)return s+'R$ '+(a/1e3).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' mil';
 return s+'R$ '+a.toLocaleString('pt-BR',{maximumFractionDigits:0});}
const pct=v=>(isFinite(v)?(v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%':'–');
const SER=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];

/* ---------------- senha ---------------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(senha){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(senha),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function iniciarSenha(){
  $('lock').style.display='block';
  let salva=null; try{salva=localStorage.getItem('dre_mir_pw');}catch(e){}
  const tentar=async(senha,auto)=>{
    $('lockErr').textContent=auto?'':'Abrindo...';
    try{const d=await abrir(senha);
      try{ if($('lembrar').checked) localStorage.setItem('dre_mir_pw',senha); }catch(e){}
      $('lock').style.display='none'; montar(d);
    }catch(e){ $('lockErr').textContent=auto?'':'Senha incorreta.'; try{if(auto)localStorage.removeItem('dre_mir_pw');}catch(e2){} }
  };
  $('entrar').onclick=()=>tentar($('pw').value,false);
  $('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tentar($('pw').value,false);});
  if(salva){$('lembrar').checked=true; tentar(salva,true);} else $('pw').focus();
}

/* ---------------- tooltip ---------------- */
const tip=$('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.display='block';
 const x=Math.min(e.clientX+14,window.innerWidth-tip.offsetWidth-8),y=Math.min(e.clientY+14,window.innerHeight-tip.offsetHeight-8);
 tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.style.display='none';}
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]'); if(t)showTip(e,t.getAttribute('data-tip')); else hideTip();});

/* ---------------- dados ---------------- */
let RAW,D,MS,ST={colunas:'meses',un:null,per:'acum',tab:'geral',zeros:false,abertos:{},unid:null,visao:'cons',editar:false,ano:null};
let AJ={valores:{},geral:{},log:[]};      // ajustes (salvos + novos desta sessão)
let AJ_NOVOS=0;
const ABREV=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const NOMES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const GERAL_ROT={receita_bruta:'Receita bruta',outras_receitas:'Outras receitas',impostos:'Impostos incidentes',recuperacao:'Recuperação de impostos'};
function somaP(arr){ if(ST.per==='acum') return MS.reduce((a,i)=>a+(arr[i]||0),0); return arr[ST.per]||0; }
function nomePer(){return ST.per==='acum'?('Acumulado '+ABREV[MS[0]]+'–'+ABREV[MS[MS.length-1]]+'/'+ST.ano):NOMES[ST.per]+'/'+ST.ano;}
function rl(){return somaP(D.dre.receita_liquida);}
function folhas(n,out){(n.filhos||[]).forEach(f=>{ if(f.filhos&&f.filhos.length)folhas(f,out); else if(!f.fora)out.push(f);});return out;}
function acharConta(re){let r=null;D.grupos.forEach(g=>folhas(g,[]).forEach(f=>{if(!r&&re.test(f.nome))r=f;}));return r;}
const chave=(ano,i)=>ano+'-'+String(i+1).padStart(2,'0');

function valorLinha(k,u,id){const a=((AJ.valores[k]||{})[u]||{});if(id in a)return a[id];return ((RAW.valores[k]||{})[u]||{})[id]||0;}
function valorOrig(k,u,id){return ((RAW.valores[k]||{})[u]||{})[id]||0;}
function temAjuste(k,u,id){return id in (((AJ.valores[k]||{})[u])||{});}
function valorGeral(k,g){const a=AJ.geral[k]||{};if(g in a)return a[g];return (RAW.geral[k]||{})[g]||0;}


function detLista(k,u,id){const d=((RAW.detalhes||{})[k]||{});
  if(u) return ((d[u]||{})[id]||[]).map(x=>({u,o:x[0],v:x[1]}));
  const out=[];Object.keys(d).forEach(uu=>((d[uu]||{})[id]||[]).forEach(x=>out.push({u:uu,o:x[0],v:x[1]})));return out;}
function detTip(k,u,id,nome){const L=detLista(k,u,id);if(!L.length){return (RAW.origem||{})[k]&&String(RAW.origem[k]).startsWith('planilha')?'':'';}
  return '<b>'+esc(nome)+' · '+k.slice(5)+'/'+k.slice(0,4)+'</b><br>'+L.sort((a,b)=>b.v-a.v).slice(0,14).map(x=>(u?'':'<span class=m>'+esc(x.u)+'</span> ')+esc(x.o)+': <b>'+brl(x.v)+'</b>').join('<br>')+(L.length>14?'<br>… +'+(L.length-14):'');}

function calcular(){
  const E=RAW.estrutura, U=RAW.unidades, ano=ST.ano;
  const ks=Array.from({length:12},(_,i)=>chave(ano,i));
  MS=ks.map((k,i)=>[k,i]).filter(([k])=>RAW.geral[k]||RAW.valores[k]).map(x=>x[1]);
  const filhos={};E.forEach(n=>{if(n.pai)(filhos[n.pai]=filhos[n.pai]||[]).push(n);});
  // valores por unidade de cada linha
  const vu={};U.forEach(u=>{vu[u]={};E.forEach(n=>{if(n.tipo==='linha')vu[u][n.id]=ks.map(k=>valorLinha(k,u,n.id));});});
  function arvore(n,u){ // u=null -> consolidado
    const no={id:n.id,cod:n.cod,nome:n.nome,tipo:n.tipo,fora:n.fora};
    if(n.tipo==='linha'){no.v=u?vu[u][n.id].slice():ks.map((_,i)=>U.reduce((a,x)=>a+vu[x][n.id][i],0));return no;}
    no.filhos=(filhos[n.id]||[]).map(f=>arvore(f,u));
    no.v=ks.map((_,i)=>no.filhos.reduce((a,f)=>a+(f.fora?0:f.v[i]),0));return no;}
  const raiz=E.filter(n=>n.tipo==='grupo');

  const desp=ks.map((_,i)=>grupos.reduce((a,g)=>a+g.v[i],0));
  const G=g=>ks.map(k=>valorGeral(k,g));
  const bruta=G('receita_bruta'),outras=G('outras_receitas'),imp=G('impostos'),rec=G('recuperacao');
  const liq=ks.map((_,i)=>bruta[i]-imp[i]+rec[i]+outras[i]);
  const juros=E.filter(n=>n.tipo==='linha'&&/^juros (pagos a terceiros|pagos a inst)/i.test(n.nome)).map(n=>n.id);
  const jur=ks.map((_,i)=>juros.reduce((a,id)=>a+U.reduce((b,u)=>b+vu[u][id][i],0),0));
  const res=ks.map((_,i)=>liq[i]-desp[i]);
  const ebitda=ks.map((_,i)=>bruta[i]-desp[i]+jur[i]);
  const unidades=U.map(u=>{const gs=raiz.map(g=>arvore(g,u));return {nome:u==='Frota'?'Frota (transferência)':u,cod:u,grupos:gs,total:ks.map((_,i)=>gs.reduce((a,g)=>a+g.v[i],0))};});
  D={titulo:RAW.titulo,nota:RAW.nota,meses:MS,abrev:ABREV,nomes_meses:NOMES,
     dre:{receita_bruta:bruta,outras_receitas:outras,impostos:imp,recuperacao:rec,receita_liquida:liq,despesas:desp,resultado:res,ebitda},
     grupos,unidades,conferencia:RAW.conferencia||[]};
}

/* ---------------- gráficos SVG ---------------- */
function eixoY(max,min){ // ticks "bonitos"
  const span=max-min||1, raw=span/4, mag=Math.pow(10,Math.floor(Math.log10(raw))), st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>span/x<=5);
  const t=[],a=Math.floor(min/st+1e-9),b=Math.ceil(max/st-1e-9);for(let k=a;k<=b;k++)t.push(k*st);if(t.length<2)t.push((b+1)*st);return t;}
function barras(el,{cats,series,h=240,fmtTip,destaque,pctTip,fmtY=curto,fmtV=brl}){
  const W=760,L=64,R=8,T=10,B=26,ph=h-T-B,pw=W-L-R;
  let max=0,min=0;series.forEach(s=>s.v.forEach(v=>{max=Math.max(max,v);min=Math.min(min,v);}));
  const tk=eixoY(max,min),ymax=tk[tk.length-1],ymin=tk[0],y=v=>T+ph*(ymax-v)/(ymax-ymin||1);
  const n=cats.length,gw=pw/n,bw=Math.min(28,(gw-10)/series.length-2);
  let s=`<svg viewBox="0 0 ${W} ${h}">`;
  tk.forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'rgba(11,11,11,.35)':'rgba(11,11,11,.08)'}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmtY(v).replace('R$ ','')}</text>`;});
  cats.forEach((c,i)=>{const x0=L+gw*i,cx=x0+gw/2;
    if(destaque===i)s+=`<rect x="${x0+2}" y="${T}" width="${gw-4}" height="${ph}" fill="#fff6d6"/>`;
    s+=`<text x="${cx}" y="${h-8}" text-anchor="middle" style="${destaque===i?'font-weight:800;fill:#293082':''}">${esc(c)}</text>`;
    const tot=series.length*(bw+2)-2;
    series.forEach((se,k)=>{const v=se.v[i],x=cx-tot/2+k*(bw+2),y1=y(Math.max(v,0)),y2=y(Math.min(v,0)),hh=Math.max(1,y2-y1);
      const col=se.cor(v),r=Math.min(4,bw/2,hh);
      const p=v>=0?`M${x},${y2} V${y1+r} q0,-${r} ${r},-${r} H${x+bw-r} q${r},0 ${r},${r} V${y2} Z`:`M${x},${y1} V${y2-r} q0,${r} ${r},${r} H${x+bw-r} q${r},0 ${r},-${r} V${y1} Z`;
      s+=`<path d="${p}" fill="${col}"/>`;});
    const tipH=`<b>${esc(c)}</b><br>`+series.map(se=>`<span class="m">${esc(se.nome)}:</span> ${fmtV(se.v[i])}${pctTip?' <span class="m">('+pct(pctTip(se,i))+')</span>':''}`).join('<br>');
    s+=`<rect x="${x0}" y="${T}" width="${gw}" height="${ph}" fill="transparent" data-tip="${esc(tipH)}"/>`;});
  s+='</svg>';
  el.innerHTML=(series.length>1?'<div class="legend">'+series.map(se=>`<span><i style="background:${se.cor(1)}"></i>${esc(se.nome)}</span>`).join('')+'</div>':'')+`<div class="chart">${s}</div>`;
}
function empilhadas(el,{cats,series,h=300,destaque}){
  const W=1240,L=64,R=8,T=10,B=26,ph=h-T-B,pw=W-L-R;
  const tot=cats.map((_,i)=>series.reduce((a,s)=>a+Math.max(0,s.v[i]),0));
  const tk=eixoY(Math.max(...tot),0),ymax=tk[tk.length-1],y=v=>T+ph*(ymax-v)/ymax;
  const n=cats.length,gw=pw/n,bw=Math.min(44,gw-14);
  let s=`<svg viewBox="0 0 ${W} ${h}">`;
  tk.forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'rgba(11,11,11,.35)':'rgba(11,11,11,.08)'}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${curto(v).replace('R$ ','')}</text>`;});
  cats.forEach((c,i)=>{const x0=L+gw*i,cx=x0+gw/2,x=cx-bw/2;
    if(destaque===i)s+=`<rect x="${x0+2}" y="${T}" width="${gw-4}" height="${ph}" fill="#fff6d6"/>`;
    s+=`<text x="${cx}" y="${h-8}" text-anchor="middle" style="${destaque===i?'font-weight:800;fill:#293082':''}">${esc(c)}</text>`;
    let acc=0;series.forEach((se,k)=>{const v=Math.max(0,se.v[i]);if(!v)return;const y1=y(acc+v),y2=y(acc);acc+=v;
      s+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0,y2-y1-2)}" fill="${se.cor}" ${k===series.length-1?'rx="3"':''}/>`;});
    const tipH=`<b>${esc(c)} · total ${brl0(tot[i])}</b><br>`+series.map(se=>`<span class="m">${esc(se.nome)}:</span> ${brl0(se.v[i])} <span class="m">(${pct(se.v[i]/tot[i])})</span>`).join('<br>');
    s+=`<rect x="${x0}" y="${T}" width="${gw}" height="${ph}" fill="transparent" data-tip="${esc(tipH)}"/>`;});

  el.innerHTML='<div class="legend">'+series.map(se=>`<span><i style="background:${se.cor}"></i>${esc(se.nome)}</span>`).join('')+'</div>'+`<div class="chart">${s}</div>`;

function linhaMini(el,{cats,v,destaque,fmt=pct}){
  const W=300,h=92,L=4,R=4,T=8,B=16,ph=h-T-B,pw=W-L-R;
  const ok=v.filter(x=>isFinite(x));if(!ok.length){el.innerHTML='';return;}
  let mx=Math.max(...ok),mn=Math.min(...ok);if(mx===mn){mx+=0.01;mn-=0.01;}const pad=(mx-mn)*0.15;mx+=pad;mn-=pad;
  const x=i=>L+(cats.length===1?pw/2:pw*i/(cats.length-1)),y=val=>T+ph*(mx-val)/(mx-mn);
  let p='';v.forEach((val,i)=>{if(isFinite(val))p+=(p?'L':'M')+x(i)+','+y(val);});
  let s=`<svg viewBox="0 0 ${W} ${h}"><path d="${p}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  v.forEach((val,i)=>{if(!isFinite(val))return;const on=destaque===i;
    s+=`<circle cx="${x(i)}" cy="${y(val)}" r="${on?4.5:2.5}" fill="${on?'var(--s2)':'var(--s1)'}" stroke="#fcfcfb" stroke-width="${on?2:0}"/>`;
    s+=`<rect x="${x(i)-pw/cats.length/2}" y="0" width="${pw/cats.length}" height="${h}" fill="transparent" data-tip="<b>${esc(cats[i])}</b>: ${fmt(val)}"/>`;});
  s+=`<text x="${L}" y="${h-2}">${esc(cats[0])}</text><text x="${W-R}" y="${h-2}" text-anchor="end">${esc(cats[cats.length-1])}</text></svg>`;
  el.innerHTML=`<div class="chart">${s}</div>`;
}
function hbars(el,itens,{total,clique}={}){
  const mx=Math.max(...itens.map(i=>Math.abs(i.v)),1);
  el.innerHTML=itens.map((it,k)=>`<div class="hb ${clique?'click':''}" data-k="${k}" data-tip="<b>${esc(it.nome)}</b><br>${brl(it.v)}${total?' · '+pct(it.v/total)+' da receita líquida':''}">

function origemUnidade(el,cod,fl){

function modoDre(){return `<div class="segs"><button class="seg ${ST.colunas!=='unid'?'on':''}" data-c="meses">Mês a mês</button><button class="seg ${ST.colunas==='unid'?'on':''}" data-c="unid">Por unidade (lado a lado)</button></div>`;}
function ligarModo(){document.querySelectorAll('.seg').forEach(b=>b.onclick=()=>{ST.colunas=b.dataset.c;rDre();});}
function rDre(){ if(ST.colunas==='unid') rDreUnidades(); else rDreMeses(); ligarModo(); }
function rDreUnidades(){
  const el=$('s-dre'),U=D.unidades,dr=D.dre;
  const mapas=U.map(u=>{const m={};const w=n=>{m[n.id]=n.v;(n.filhos||[]).forEach(w);};u.grupos.forEach(w);return m;});
  const mesSel=ST.per!=='acum', k=mesSel?chave(ST.ano,ST.per):null;
  const fmt=v=>(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const totDesp=somaP(dr.despesas), RLp=somaP(dr.receita_liquida);
  const linha=(nome,cls,id,temFilhos,fora,vals,total,leaf)=>{
    if(!ST.zeros&&!cls.includes('tot')&&!total&&vals.every(v=>!v))return '';
    const cel=(v,j)=>{let c=v<0?'neg':'',attr='';const u=U[j].cod;
      if(leaf&&mesSel){if(temAjuste(k,u,id)){c+=' aj';attr=` data-tip="Ajustado no painel · valor original ${esc(brl(valorOrig(k,u,id)))}"`;}
        if(ST.editar){c+=' ed';attr+=` data-k="${k}" data-u="${u}" data-id="${esc(id)}" data-n="${esc(nome)}"`;}}
      if(leaf&&mesSel&&v&&!attr.includes('data-tip')){const t=detTip(k,u,id,nome);if(t){attr+=` data-tip="${esc(t+'<br><i>clique para ver no registro de fontes</i>')}"`;c+=' temdet';}}
      if(leaf&&mesSel&&v&&!ST.editar){attr+=` data-fk="${k}" data-fu="${u}" data-fid="${esc(id)}"`;c+=' trace';}
      return `<td class="${c}"${attr}>${v?fmt(v):'–'}</td>`;};
    return `<tr class="${cls}${fora?' fora':''}"><td title="${esc(nome)}">${temFilhos?`<span class="tg ${ST.abertos['u/'+id]?'open':''}" data-id="${esc('u/'+id)}">${esc(nome)}</span>`:esc(nome)}</td>`+
      vals.map(cel).join('')+`<td class="sel" style="font-weight:700">${fmt(total)}</td><td>${pct(total/RLp)}</td></tr>`;};
  let rows='';
  const vazio=U.map(()=>0);
  rows+=linha('Receita bruta','tot',null,false,false,vazio,somaP(dr.receita_bruta));
  rows+=linha('(+) Outras receitas','g2',null,false,false,vazio,somaP(dr.outras_receitas));
  rows+=linha('(−) Impostos incidentes s/ vendas e serviços','g2',null,false,false,vazio,somaP(dr.impostos));
  rows+=linha('(+) Recuperação de impostos','g2',null,false,false,vazio,somaP(dr.recuperacao));
  rows+=linha('= Receita líquida de serviços','tot',null,false,false,vazio,RLp);
  rows+=linha('(−) Despesas','tot',null,false,false,U.map(u=>somaP(u.total)),totDesp);
  const rec=(n,nivel)=>{let r='';(n.filhos||[]).forEach(f=>{const tem=f.filhos&&f.filhos.length;
     r+=linha((f.cod?f.cod+' ':'')+f.nome,'g'+nivel,f.id,tem,f.fora,mapas.map(m=>somaP(m[f.id]||[])),somaP(f.v),f.tipo==='linha');
     if(tem&&ST.abertos['u/'+f.id])r+=rec(f,Math.min(nivel+1,4));});return r;};
  D.grupos.forEach(g=>{rows+=linha(g.cod+' '+g.nome,'g1',g.id,true,false,mapas.map(m=>somaP(m[g.id]||[])),somaP(g.v));if(ST.abertos['u/'+g.id])rows+=rec(g,2);});
  rows+=linha('= Resultado operacional','tot',null,false,false,vazio,somaP(dr.resultado));
  rows+=linha('EBITDA (critério da planilha)','tot',null,false,false,vazio,somaP(dr.ebitda));
  rows+=`<tr class="g2"><td>Participação nas despesas</td>${U.map(u=>`<td>${pct(somaP(u.total)/totDesp)}</td>`).join('')}<td class="sel">100%</td><td></td></tr>`;
  el.innerHTML=`<div class="card"><h3>DRE detalhado por unidade — ${esc(nomePer())}</h3><p class="hint">Cada coluna é uma unidade; a coluna destacada é a MirindoSul (soma). Receita, impostos e resultado são da empresa toda — as unidades têm só despesas. Troque o mês/acumulado na barra do topo.</p>
   ${modoDre()}<div class="opts"><button class="btn" id="abrirTudo">Abrir tudo</button><button class="btn" id="fecharTudo">Fechar tudo</button>
   <label><input type="checkbox" id="zeros" ${ST.zeros?'checked':''}> mostrar contas zeradas</label>
   <label class="edsw"><input type="checkbox" id="editar" ${ST.editar?'checked':''}> <b>editar valores</b></label><button class="btn" id="csv">Exportar CSV</button></div>
   ${ST.editar?`<div class="alerta" style="margin:6px 0 10px">${mesSel?'Modo edição: clique no valor de uma conta numa unidade para corrigir. Deixe em branco para voltar ao original.':'Para editar, escolha um <b>mês</b> na barra do topo (no acumulado não dá para editar).'}</div>`:''}
   <div class="tw"><table><thead><tr><th>Conta</th>${U.map(u=>`<th><i class="dot" style="background:${SER_UN(u.cod)}"></i>${esc(u.cod)}</th>`).join('')}<th class="sel">MirindoSul</th><th>% RL</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  el.querySelectorAll('.tg').forEach(t=>t.onclick=()=>{const id=t.dataset.id;ST.abertos[id]=!ST.abertos[id];rDre();});
  $('zeros').onchange=e=>{ST.zeros=e.target.checked;rDre();};
  $('editar').onchange=e=>{ST.editar=e.target.checked;rDre();};
  $('fecharTudo').onclick=()=>{ST.abertos={};rDre();};
  $('abrirTudo').onclick=()=>{const m=n=>{(n.filhos||[]).forEach(f=>{if(f.filhos&&f.filhos.length){ST.abertos['u/'+f.id]=1;m(f);}});};D.grupos.forEach(g=>{ST.abertos['u/'+g.id]=1;m(g);});rDre();};
  ligarEdicao(el,rDre);
  $('csv').onclick=()=>{const L=[['Conta',...U.map(u=>u.cod),'MirindoSul','% RL']];
    el.querySelectorAll('tbody tr').forEach(tr=>L.push([...tr.children].map(td=>td.textContent.trim())));baixar('DRE_por_unidade_'+(mesSel?k:'acumulado_'+ST.ano)+'.csv',L);};
}
function ligarRastreio(el){el.querySelectorAll('td.trace').forEach(td=>td.addEventListener('click',()=>{
  ST.fonte={mes:td.dataset.fk,unid:td.dataset.fu||(GERAL_ROT[td.dataset.fid]?'__g':'*'),linha:td.dataset.fid,q:'',tipo:''};ST.tab='fontes';render();window.scrollTo(0,0);}));}
function ligarEdicao(el,refazer){ligarRastreio(el);
  el.querySelectorAll('td.ed').forEach(td=>td.onclick=()=>{
    if(td.querySelector('input'))return;
    const atual=td.textContent.trim()==='–'?'0,00':td.textContent.trim();
    td.innerHTML=`<input type="text" value="${atual}" style="width:110px;text-align:right">`;
    const inp=td.querySelector('input');inp.focus();inp.select();
    let feito=false;
    const fim=ok=>{if(feito)return;feito=true;if(!ok){refazer();return;}const t=inp.value.trim();
      if(t===atual){refazer();return;}
      let novo=null;if(t!==''){novo=parseFloat(t.replace(/\./g,'').replace(',','.'));if(!isFinite(novo)){alert('Valor inválido. Use o formato 1.234,56');refazer();return;}}
      ajustar(td.dataset.k,td.dataset.u,td.dataset.id,td.dataset.n,novo===null?null:Math.round(novo*100)/100);};
    inp.onkeydown=e=>{if(e.key==='Enter')fim(true);if(e.key==='Escape')fim(false);};
    inp.onblur=()=>fim(true);});
}

function rDreMeses(){
  if(ST.un&&ST.visao!==ST.un)ST.visao=ST.un; if(!ST.un&&ST.visao!=='cons'&&!D.unidades.find(x=>x.cod===ST.visao))ST.visao='cons';

  const fmt=v=>(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const fp=v=>isFinite(v)&&v?(v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%':'';

      if(editInfo){const k=chave(ST.ano,i),aj=editInfo.u==='__geral'?(k in AJ.geral&&editInfo.id in AJ.geral[k]):temAjuste(k,editInfo.u,editInfo.id);
        if(aj){c+=' aj';attr=` data-tip="Ajustado no painel · valor original ${esc(brl(editInfo.u==='__geral'?((RAW.geral[k]||{})[editInfo.id]||0):valorOrig(k,editInfo.u,editInfo.id)))}"`;}
        if(ST.editar){c+=' ed';attr+=` data-k="${k}" data-u="${esc(editInfo.u)}" data-id="${esc(editInfo.id)}" data-n="${esc(nome)}"`;}}
      if(leafId&&arr[i]&&!attr.includes('data-tip')){const t=detTip(chave(ST.ano,i),cons?null:ST.visao,leafId,nome);if(t){attr+=` data-tip="${esc(t+'<br><i>clique para ver no registro de fontes</i>')}"`;c+=' temdet';}}
      if(!ST.editar&&arr[i]&&(leafId||(editInfo&&editInfo.u==='__geral'))){attr+=` data-fk="${chave(ST.ano,i)}" data-fu="${cons?'':esc(ST.visao)}" data-fid="${esc(leafId||editInfo.id)}"`;c+=' trace';}
      return `<td class="${c}"${attr}>${fmt(arr[i])}</td>`+(P?`<td class="pc ${sel}">${fp(arr[i]/base[i])}</td>`:'');};
    return `<tr class="${cls}${fora?' fora':''}"><td title="${esc(nome)}">${temFilhos?`<span class="tg ${ST.abertos[id]?'open':''}" data-id="${esc(id)}">${esc(nome)}</span>`:esc(nome)}</td>`+
     MS.map(cel).join('')+`<td class="${ST.per==='acum'?'sel':''}" style="font-weight:700">${fmt(ac)}</td>`+(P?`<td class="pc">${fp(ac/tot(base))}</td>`:'')+`<td>${fmt(ac/MS.length)}</td></tr>`;};
  let rows='';

    const g=(n,k,cls)=>linha(n,dr[k],cls,null,false,false,{u:'__geral',id:k},baseRec);
    rows+=g('Receita bruta','receita_bruta','tot');

    rows+=g('2. Impostos incidentes s/ vendas e serv.','impostos','g2');
    rows+=g('3. Recuperação de impostos','recuperacao','g2');
    rows+=linha('4. Receita líquida de serviços',dr.receita_liquida,'tot',null,false,false,null,baseRec);
    rows+=linha('5 Despesas',dr.despesas,'tot',null,false,false,null,baseDesp);
  } else rows+=linha('5 Despesas — '+uObj.nome,uObj.total,'tot',null,false,false,null,baseDesp);

     r+=linha((f.cod?f.cod+' ':'')+f.nome,f.v,'g'+nivel,fid,tem,f.fora,(!cons&&f.tipo==='linha')?{u:ST.visao,id:f.id}:null,baseDesp,f.tipo==='linha'?f.id:null);
     if(tem&&ST.abertos[fid])r+=rec(f,Math.min(nivel+1,4),fid);});return r;};
  (cons?D.grupos:uObj.grupos).forEach(g=>{rows+=linha(g.cod+' '+g.nome,g.v,'g1',g.id,true,false,null,baseDesp);if(ST.abertos[g.id])rows+=rec(g,2,g.id);});
  if(cons){rows+=linha('6. Resultado operacional',dr.resultado,'tot',null,false,false,null,baseRec);rows+=linha('7. EBITDA',dr.ebitda,'tot',null,false,false,null,baseRec);}
  el.innerHTML=`<div class="card"><h3>${cons?'Demonstrativo de Resultados':'Relatório de despesas — '+esc(uObj.nome)} — ${ST.ano}</h3><p class="hint">Mesmo formato da planilha do DRE: valor e % de cada mês, total do ano, % e média mensal. % das receitas e do resultado = sobre a receita bruta; % das despesas = sobre o total de despesas${cons?'':' da unidade'}. Clique num grupo (▸) para abrir as contas.</p>

   <button class="btn" id="abrirTudo">Abrir tudo</button><button class="btn" id="fecharTudo">Fechar tudo</button>

   <div class="tw"><table class="xl"><thead><tr><th>Descrição</th>${MS.map(i=>`<th class="${ST.per===i?'sel':''}">${NOMES[i]}</th>`+(P?`<th class="pc ${ST.per===i?'sel':''}">%</th>`:'')).join('')}<th class="${ST.per==='acum'?'sel':''}">Ano ${ST.ano}</th>${P?'<th class="pc">%</th>':''}<th>Média mensal</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;

  $('fecharTudo').onclick=()=>{ST.abertos={};rDre();};
  $('abrirTudo').onclick=()=>{const marca=(n,id)=>{(n.filhos||[]).forEach(f=>{if(f.filhos&&f.filhos.length){ST.abertos[id+'/'+f.id]=1;marca(f,id+'/'+f.id);}});};
    (cons?D.grupos:uObj.grupos).forEach(g=>{ST.abertos[g.id]=1;marca(g,g.id);});rDre();};

    <button class="btn" id="fCsv">Exportar CSV</button></div>
   <div id="fRes"></div></div>
   <div class="card"><h3>Execuções da automação</h3><p class="hint">Cada vez que o DRE foi montado: quando, em qual computador/usuário, qual mês e quais fontes foram lidas.</p>
   <div class="tw" style="max-height:40vh"><table><thead><tr><th>Quando</th><th>Mês</th><th style="text-align:left">Computador / usuário</th><th style="text-align:left">Fontes lidas</th></tr></thead><tbody>
   ${ex.map(e=>`<tr><td style="text-align:left">${esc(e.quando)}</td><td>${esc(e.mes)}</td><td style="text-align:left">${esc((e.computador||'')+' / '+(e.usuario||''))}</td><td style="text-align:left;white-space:normal">${(e.fontes||[]).map(esc).join('<br>')}</td></tr>`).join('')||'<tr><td colspan="4" class="hint">—</td></tr>'}</tbody></table></div></div>`;
  const filtra=()=>R.filter(r=>(!F.mes||r.k===F.mes)&&(F.unid==='*'||!F.unid?true:(F.unid==='__g'?r.u==='':r.u===F.unid))&&(!F.linha||r.id===F.linha)&&(!F.tipo||tipoFonte(r.o)===F.tipo)&&
     (!F.q||(r.linha+' '+r.o+' '+r.u).toLowerCase().includes(F.q.toLowerCase())));
  const pinta=()=>{const L=filtra().sort((a,b)=>a.k<b.k?1:a.k>b.k?-1:(a.u<b.u?-1:a.u>b.u?1:(b.v-a.v)));const tot=L.reduce((a,x)=>a+x.v,0);
    // conferência: soma das origens x valor mostrado no DRE (quando filtrado por mês+unidade+linha)
    let confere='';if(F.mes&&F.linha){const mostrado=F.unid&&F.unid!=='*'&&F.unid!=='__g'?valorLinha(F.mes,F.unid,F.linha):(GERAL_ROT[F.linha]?valorGeral(F.mes,F.linha):(RAW.unidades||[]).reduce((a,u)=>a+valorLinha(F.mes,u,F.linha),0));
      const ok=Math.abs(mostrado-tot)<0.05;confere=`<div class="alerta ${ok?'ok':''}" style="margin:8px 0">${ok?'✔ A soma das origens bate com o valor do DRE':'⚠ A soma das origens não bate com o valor do DRE'}: origens ${brl(tot)} · DRE ${brl(mostrado)}</div>`;}
    $('fRes').innerHTML=confere+`<p class="hint" style="margin:6px 0">${L.length.toLocaleString('pt-BR')} registros · soma ${brl(tot)}${L.length>2000?' · mostrando os 2.000 primeiros (use os filtros)':''}</p>
     <div class="tw" style="max-height:62vh"><table><thead><tr><th>Mês</th><th>Unidade</th><th>Linha do DRE</th><th>Valor</th><th style="text-align:left">Origem</th><th>Fonte</th></tr></thead><tbody>
     ${L.slice(0,2000).map(r=>`<tr class="${r.aj?'fora':''}"><td>${r.k.slice(5)}/${r.k.slice(2,4)}</td><td>${esc(r.u||'MirindoSul')}</td><td title="${esc(r.linha)}" style="text-align:left">${esc(r.linha)}</td><td>${brl(r.v)}</td><td style="text-align:left;white-space:normal;min-width:360px">${esc(r.o)}</td><td>${esc(tipoFonte(r.o))}</td></tr>`).join('')||'<tr><td colspan="6" class="hint">Nenhum registro com esses filtros.</td></tr>'}</tbody></table></div>`;};
  const ligar=(id,ch,ev='onchange')=>{$(id)[ev]=e=>{F[ch]=e.target.value;pinta();};};
  ligar('fMes','mes');ligar('fUn','unid');ligar('fTipo','tipo');ligar('fQ','q','oninput');
  if($('fLimpaL'))$('fLimpaL').onclick=e=>{e.preventDefault();F.linha='';rFontes();};
  $('fCsv').onclick=()=>{const L=filtra();baixar('DRE_fontes'+(F.mes?'_'+F.mes:'')+'.csv',[['Mês','Unidade','Linha do DRE','Valor','Origem','Fonte'],...L.map(r=>[r.k,r.u||'MirindoSul',r.linha,(r.v||0).toFixed(2).replace('.',','),r.o,tipoFonte(r.o)])]);};
  pinta();
}

/* ---------------- Conferência ---------------- */
function rConf(){
  const c=D.conferencia||[];
  const log=(AJ.log||[]).slice().reverse();
  $('s-conf').innerHTML=`<div class="card"><h3>Conferência da geração</h3><p class="hint">Pendências e avisos encontrados ao montar o DRE (arquivos, SSW e linhas sem fonte). Nada é alterado automaticamente.</p>`+
   (c.length?c.map(a=>`<div class="alerta ${a.tipo==='ok'?'ok':''}">${esc(a.texto)}</div>`).join(''):'<div class="alerta ok">Nenhuma pendência.</div>')+'</div>'+
   `<div class="card"><h3>Ajustes feitos no painel</h3><p class="hint">Cada correção manual fica registrada aqui (mês, unidade, linha, de → para).</p>`+
   (log.length?`<div class="tw" style="max-height:50vh"><table><thead><tr><th>Quando</th><th>Mês</th><th>Unidade</th><th>Linha</th><th>De</th><th>Para</th></tr></thead><tbody>${log.map(l=>`<tr><td style="text-align:left">${esc(l.quando)}</td><td>${esc(l.mes)}</td><td>${esc(l.unidade)}</td><td style="text-align:left">${esc(l.linha)}</td><td>${brl(l.de||0)}</td><td>${brl(l.para||0)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="alerta ok">Nenhum ajuste manual.</div>')+'</div>';
}

if(MODO==='senha') iniciarSenha(); else montar(PAYLOAD);
})();
</script>
</body></html>
